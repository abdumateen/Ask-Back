# PRD §14.1 core cell. Values match the frozen implementation; cli.validate
# refuses any drift rather than silently ignoring a key.
run_id: core_v1
master_seed: 20250

domain: {n_fields: 15, rule_density: high, validator_tier: 1}
extractor: {type: stub, p_clean: 0.50, p_uncertain: 0.30, p_missing: 0.20}
merger: direct
simulator: {answer_renderer: analytic}

policies: [P0, P1, P2, P3]
personas: [realistic]
n_episodes: 100

# exact_max_* carry A12 F3/R1 (6 fields, 5000 joint states), not §14.1's
# pre-amendment 8 / 20000.
voi: {n_mc: 2048, exact_max_uncertain: 6, exact_max_states: 5000}
stop_grids:
  S1_c: [0.005, 0.01, 0.02, 0.05, 0.10]
cost: {alpha: 1.0, beta: 10.0, gamma: 5.0}

bootstrap: {n_resamples: 10000, ci: 0.95}
out_dir: runs/core_v1